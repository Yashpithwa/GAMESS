<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7UP & 7DOWN</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="dice.css">
</head>
<body>
    <div class="main">
        <div class="heading">7UP & 7 DOWN</div>
        <div class="box">
            <div class="winnertext">
                <div class="totalscore" id="tot">TOTAL:0</div>
                <div class="wintext" id="msg">Lorem ipsum dolor sit.</div>

            </div>
            <div class="dicebox">
                <div class="mainbox">
                    <div class="smallbox">
                        <img id="dice-01" class="dice">
                      
                        <img id="dice-02" class="dice">
                    </div>
                </div>
            </div>
            <div class="option">
                <div class="opt opt1" id="opt1"><div class="circle" id="1"></div><div class="sel">7 UP</div></div>
                <div class="opt opt2" id="opt2"><div class="circle " id="2"></div><div class="sel">7</div></div>
                <div class="opt opt3" id="opt3"><div class="circle" id="3"></div><div class="sel">7 DOWN</div></div>
                
            </div>
            <div class="button">
                <button id="btn">play</button>
            </div>
        </div>
    </div>
    <script>
        



    
        let select1 = document.getElementById("opt1");
let select2 = document.getElementById("opt2");
let select3 = document.getElementById("opt3");

let c1 = document.getElementById("1");
let c2 = document.getElementById("2");
let c3 = document.getElementById("3");

let a;

select1.addEventListener("click", () => {
    a = 1;
    c1.style.backgroundColor = "black";
    c2.style.backgroundColor = "white"; 
    c3.style.backgroundColor = "white";
});

select2.addEventListener("click", () => {
    a = 2;
    c2.style.backgroundColor = "black";
    c1.style.backgroundColor = "white"; 
    c3.style.backgroundColor = "white";
});

select3.addEventListener("click", () => {
    a = 3;
    c3.style.backgroundColor = "black";
    c1.style.backgroundColor = "white"; 
    c2.style.backgroundColor = "white";
});

let images = [
    "dice-01.svg",
    "dice-02.svg",
    "dice-03.svg",
    "dice-04.svg",
    "dice-05.svg",
    "dice-06.svg"
];

let dice = document.querySelectorAll("img");
let playbtn = document.getElementById("btn");
let msg = document.getElementById("msg");

function roll() {
    dice.forEach(function (die) {
        die.classList.add("shake");
    });

    setTimeout(function () {
        dice.forEach(function (die) {
            die.classList.remove("shake");
        });

        let die1 = Math.floor(Math.random() * 6) + 1;
        let die2 = Math.floor(Math.random() * 6) + 1;

        document.querySelector("#dice-01").setAttribute("src", images[die1 - 1]);
        document.querySelector("#dice-02").setAttribute("src", images[die2 - 1]);

        let total = die1 + die2;
        let txt = document.getElementById("tot");
        txt.innerText = `TOTAL: ${total}`;

        if (a == 1) {
            msg.innerText = total > 7 ? `🚀 Jackpot! The perfect roll! You’re the champion! 👑` 
                                      : `😢 Oops! You lost! The dice total didn't match your guess.`;
        } else if (a == 2) {
            msg.innerText = total == 7 ? `🚀 Jackpot! The perfect roll! You’re the champion! 👑` 
                                       : `😢 Oops! You lost! The dice total didn't match your guess.`;
        } else {
            msg.innerText = total < 7 ? `🚀 Jackpot! The perfect roll! You’re the champion! 👑` 
                                      : `😢 Oops! You lost! The dice total didn't match your guess.`;
        }

    }, 1000);
}

playbtn.addEventListener("click", () => {
    roll();
});

    </script>
</body>
</html>
